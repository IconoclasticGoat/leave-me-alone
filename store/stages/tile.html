<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="stage.css">
<style>
  html, body { width: 440px; height: 280px; }
  /* Half-size is the test for a promo tile, so this carries three elements and
     no more: mark, name, one claim. */
  .wrap { position: absolute; inset: 0; display: grid; align-content: center;
          justify-items: center; text-align: center; gap: 2px; z-index: 3; }
  img { width: 58px; height: 58px; margin-bottom: 12px; }
  h1 { font-size: 44px; line-height: 1; margin: 0; }
  /* The store renders this 440x280 tile at roughly 340px on the listing card,
     so the tagline is sized up and darkened to stay readable there — the old
     14px --ink-soft line was the part that vanished. The breaks are explicit:
     one claim per line reads cleaner than a wrapped block. */
  p { margin: 14px 0 0; font-size: 20px; line-height: 1.35; color: var(--ink); }
  .rule { width: 44px; height: 2px; background: var(--accent); margin-top: 18px; }
</style>
<div class="wrap">
  <img src="/ext/icons/active-128.png" alt="">
  <h1>Leave Me Alone</h1>
  <p>Necessary cookies only.<br>No prompts.<br>No popups.</p>
  <div class="rule"></div>
</div>
