<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="stage.css">
<style>
  /* The popup is the hero object. It is zoomed so its real 14px UI survives
     the store shrinking a 1280px shot into a ~640px carousel; the inner
     document still lays out at its true 324px width, so it is the shipping
     popup, only larger. */
  .copy { position: absolute; left: 84px; top: 212px; width: 620px; z-index: 3; }
  h1 { font-size: 64px; line-height: 1.03; }
  .sub { font-size: 28px; line-height: 1.45; max-width: 22ch; margin-top: 24px; }
  .window { position: absolute; left: 470px; top: 70px; width: 810px; height: 660px; border-radius: 10px 0 0 10px; }
  .window iframe { width: 810px; height: 660px; }
  .popup-shell { position: absolute; left: 742px; top: 52px; z-index: 4; }
  .popup-shell iframe { width: 324px; height: 470px; zoom: 1.5; }
</style>

<div class="copy">
  <div class="eyebrow">Leave Me Alone</div>
  <h1>Every site asks.<br>You answer once.</h1>
  <p class="sub">Cookies, notifications, location, newsletters — decided in advance,
     then applied to every site you visit, before it gets a chance to ask.</p>
</div>

<div class="window">
  <iframe src="https://example.com" scrolling="no"></iframe>
</div>

<div class="popup-shell">
  <iframe src="/ext/popup/harness.html" scrolling="no"></iframe>
</div>
