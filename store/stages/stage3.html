<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="stage.css">
<style>
  /* Two zoomed crops side by side. Each iframe lays out at a 344px viewport
     and is zoomed 1.6x, which both enlarges the modal's text and, because the
     modal is width:min(26rem, 100vw-3rem), narrows it to fit the pane. */
  .head { position: absolute; left: 84px; top: 54px; width: 1112px; z-index: 3; }
  h1 { font-size: 46px; line-height: 1.04; margin: 12px 0 0; }
  .sub { max-width: 74ch; font-size: 25px; line-height: 1.4; margin-top: 14px; }
  .pane { position: absolute; top: 276px; width: 544px; height: 452px; }
  .pane iframe { width: 340px; height: 282px; zoom: 1.6; }
  #before { left: 84px; }
  #after  { left: 652px; }
</style>

<div class="head">
  <div class="eyebrow">Dismiss newsletter popups</div>
  <h1>Mailing-list popups, closed on the way in.</h1>
  <p class="sub">It acts only on an overlay that is collecting an address &mdash; an email
     signup, or a phone field carrying SMS consent copy. Sign-in, registration and
     checkout overlays are refused outright.</p>
</div>

<div class="window pane" id="before">
  <div class="tag">Without the extension</div>
  <iframe src="/demo/index.html?only=newsletter" scrolling="no"></iframe>
</div>

<div class="window pane" id="after">
  <div class="tag good">With Leave Me Alone</div>
  <iframe src="/demo/after.html?only=newsletter" scrolling="no"></iframe>
</div>
