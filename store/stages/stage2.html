<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="stage.css">
<style>
  /* Each band shows a zoomed crop of the real demo page: the iframe lays out
     at a narrow 700px viewport and is zoomed 1.6x, so the consent bar's own
     14px text lands at ~22px in the shot and stays readable once the store
     shrinks it. */
  .head { position: absolute; left: 84px; top: 48px; width: 1112px; z-index: 3; }
  h1 { font-size: 46px; line-height: 1.04; margin: 12px 0 0; }
  .sub { max-width: 74ch; font-size: 25px; line-height: 1.4; margin-top: 14px; }
  .band { left: 84px; width: 1112px; height: 258px; position: absolute; }
  .band iframe { width: 695px; height: 161px; zoom: 1.6; }
  #before { top: 250px; }
  #after  { top: 528px; }
</style>

<div class="head">
  <div class="eyebrow">Reject cookie banners</div>
  <h1>It picks &ldquo;necessary only&rdquo; before you get there.</h1>
  <p class="sub">200+ consent platforms are answered outright. Anything it doesn&rsquo;t
     recognise gets hidden instead, so the page is yours either way.</p>
</div>

<div class="window band" id="before">
  <div class="tag">Without the extension</div>
  <iframe src="/demo/index.html?only=cookies" scrolling="no"></iframe>
</div>

<div class="window band" id="after">
  <div class="tag good">With Leave Me Alone</div>
  <iframe src="/demo/after.html?only=cookies" scrolling="no"></iframe>
</div>
