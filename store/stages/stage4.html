<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="stage.css">
<style>
  /* Paused state. The popup is taller here (it grows a status banner), so the
     zoom is a touch gentler than the hero's to keep the whole thing on the
     canvas. */
  .copy { position: absolute; left: 726px; top: 214px; width: 486px; z-index: 3; }
  h1 { font-size: 54px; line-height: 1.03; }
  .sub { font-size: 26px; line-height: 1.42; max-width: 22ch; margin-top: 22px; }
  .window { position: absolute; left: 30px; top: 70px; width: 660px; height: 660px;
            border-radius: 0 10px 10px 0; }
  .window iframe { width: 660px; height: 660px; }
  .popup-shell { position: absolute; left: 150px; top: 40px; z-index: 4; }
  .popup-shell iframe { width: 324px; height: 548px; zoom: 1.34; }
</style>

<!-- Deliberately the untouched demo page: a paused site is one the extension
     is not acting on, so the consent bar being back is the honest picture. -->
<div class="window">
  <iframe src="/demo/index.html?only=cookies" scrolling="no"></iframe>
</div>

<div class="popup-shell">
  <iframe src="/ext/popup/harness.html?paused=1&host=example.com" scrolling="no"></iframe>
</div>

<div class="copy">
  <div class="eyebrow">One site giving you trouble?</div>
  <h1>Pause it there.<br>Leave it everywhere else.</h1>
  <p class="sub">One site behaves normally again &mdash; banners, prompts and all &mdash;
     while every other site stays exactly as you set it. The toolbar icon tells you
     which mode you&rsquo;re in at a glance.</p>
</div>
