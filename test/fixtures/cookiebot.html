<div id="CybotCookiebotDialog" role="dialog" aria-modal="true">
  <div id="CybotCookiebotDialogBody">
    <div id="CybotCookiebotDialogBodyContent">
      <div id="CybotCookiebotDialogBodyContentTitle">This website uses cookies</div>
      <div id="CybotCookiebotDialogBodyContentText">
        We use cookies to personalise content and ads, to provide social media
        features and to analyse our traffic.
      </div>
      <button type="button" id="CybotCookiebotDialogBodyButtonDetails">Show details</button>
    </div>
    <div id="CybotCookiebotDialogBodyLevelButtonsSelectPane">
      <div class="CybotCookiebotDialogBodyLevelButtonWrapper CybotCookiebotDialogBodyLevelButtonWrapperHasContent">
        <input type="checkbox" id="CybotCookiebotDialogBodyLevelButtonPreferences" name="preferences" checked>
        <label for="CybotCookiebotDialogBodyLevelButtonPreferences">Preferences</label>
      </div>
      <div class="CybotCookiebotDialogBodyLevelButtonWrapper CybotCookiebotDialogBodyLevelButtonWrapperHasContent">
        <input type="checkbox" id="CybotCookiebotDialogBodyLevelButtonStatistics" name="statistics" checked>
        <label for="CybotCookiebotDialogBodyLevelButtonStatistics">Statistics</label>
      </div>
      <div class="CybotCookiebotDialogBodyLevelButtonWrapper CybotCookiebotDialogBodyLevelButtonWrapperHasContent">
        <input type="checkbox" id="CybotCookiebotDialogBodyLevelButtonMarketing" name="marketing" checked>
        <label for="CybotCookiebotDialogBodyLevelButtonMarketing">Marketing</label>
      </div>
    </div>
    <div id="CybotCookiebotDialogBodyButtons">
      <button type="button" id="CybotCookiebotDialogBodyLevelButtonLevelOptinAllowallSelection">Allow selection</button>
      <button type="button" id="CybotCookiebotDialogBodyButtonAccept">Allow all</button>
      <button type="button" id="CybotCookiebotDialogBodyButtonDecline">Deny</button>
    </div>
  </div>
</div>
